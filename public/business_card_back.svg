<svg xmlns="http://www.w3.org/2000/svg" width="50mm" height="90mm" viewBox="0 0 500 900">
  <!-- Background: Deep Obsidian Dark -->
  <rect width="500" height="900" fill="#0E121A" />
  
  <!-- Outer Gold Bleed / Border Frame -->
  <rect x="25" y="25" width="450" height="850" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.3" rx="8" />

  <!-- Top Mini Symbol -->
  <g transform="translate(250, 150) scale(0.45)">
    <line x1="-130" y1="20" x2="130" y2="20" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" />
    <path d="M -90,20 A 90,90 0 0,1 90,20" fill="none" stroke="#E8CA9E" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="20" r="7" fill="#F3C969" />
  </g>

  <!-- Name & Title -->
  <text x="250" y="250" font-family="'Noto Sans KR', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">
    이 경 윤
  </text>
  
  <text x="250" y="295" font-family="'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#F3C969" letter-spacing="6" text-anchor="middle">
    대 표 / 마 스 터 코 치
  </text>

  <!-- Divider Line -->
  <line x1="180" y1="340" x2="320" y2="340" stroke="#D4AF37" stroke-width="1" opacity="0.5" />

  <!-- Contact Information Section -->
  <g transform="translate(70, 440)" font-family="'Noto Sans KR', 'Segoe UI', sans-serif">
    <!-- Phone -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-size="11" font-weight="900" fill="#F3C969" letter-spacing="2">TEL</text>
      <text x="70" y="0" font-size="15" font-weight="700" fill="#E2E8F0" letter-spacing="1">010-9114-2352</text>
    </g>
    
    <!-- Email -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" font-size="11" font-weight="900" fill="#F3C969" letter-spacing="2">EMAIL</text>
      <text x="70" y="0" font-size="14" font-weight="500" fill="#CBD5E1" letter-spacing="0.5">aaccda77@naver.com</text>
    </g>

    <!-- Website -->
    <g transform="translate(0, 150)">
      <text x="0" y="0" font-size="11" font-weight="900" fill="#F3C969" letter-spacing="2">WEB</text>
      <text x="70" y="0" font-size="15" font-weight="900" fill="#F3C969" letter-spacing="0.5">myeongsimcoaching.com</text>
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <text x="250" y="800" font-family="'Noto Sans KR', sans-serif" font-size="11" font-weight="400" fill="#64748B" letter-spacing="3" text-anchor="middle">
    MYEONGSIM MINDFULNESS INSTITUTE
  </text>
</svg>
