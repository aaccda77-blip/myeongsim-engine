<svg xmlns="http://www.w3.org/2000/svg" width="50mm" height="90mm" viewBox="0 0 500 900">
  <!-- Background: Deep Obsidian Dark -->
  <rect width="500" height="900" fill="#0E121A" />
  
  <!-- Outer Gold Bleed / Border Frame -->
  <rect x="25" y="25" width="450" height="850" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.3" rx="8" />

  <!-- Master Zen Horizon Logo Symbol (Option 2 Vector) -->
  <g transform="translate(250, 400)">
    <!-- Outer Glow Ambient Arc -->
    <circle cx="0" cy="-20" r="110" fill="none" stroke="#E8CA9E" stroke-width="1" opacity="0.25" stroke-dasharray="4,4" />
    
    <!-- Horizon Line -->
    <line x1="-130" y1="20" x2="130" y2="20" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" />
    
    <!-- Sun Rays Arcs -->
    <path d="M -90,20 A 90,90 0 0,1 90,20" fill="none" stroke="#E8CA9E" stroke-width="4" stroke-linecap="round" />
    <path d="M -60,20 A 60,60 0 0,1 60,20" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" />
    <path d="M -30,20 A 30,30 0 0,1 30,20" fill="none" stroke="#F3C969" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center Rising Light Pulse Dot -->
    <circle cx="0" cy="20" r="7" fill="#F3C969" />
  </g>

  <!-- Brand Title (English & Korean) -->
  <text x="250" y="610" font-family="'Noto Sans KR', 'Cinzel', 'Trajan Pro', sans-serif" font-size="32" font-weight="900" fill="#F3C969" letter-spacing="8" text-anchor="middle">
    MYEONGSIM
  </text>
  
  <text x="250" y="660" font-family="'Noto Sans KR', sans-serif" font-size="20" font-weight="500" fill="#E8CA9E" letter-spacing="12" text-anchor="middle">
    명 심 코 칭
  </text>

  <!-- Subtitle Tagline -->
  <text x="250" y="720" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="300" fill="#8A95A5" letter-spacing="4" text-anchor="middle">
    CONSCIOUSNESS &amp; MINDFULNESS
  </text>
</svg>
