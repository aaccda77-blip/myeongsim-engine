plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mindflowlab.myeongsim'
    compileSdk 36

    defaultConfig {
        applicationId "com.mindflowlab.myeongsim"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('../myeongsim-release.jks')
            storePassword 'myeongsim2026!'
            keyAlias 'myeongsim'
            keyPassword 'myeongsim2026!'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'

    // 💰 Google Play Billing Library 8.0.0 (구글 플레이 최신 필수 규격)
    implementation 'com.android.billingclient:billing-ktx:8.0.0'

    // 📢 Google Mobile Ads (AdMob) SDK (무료 사용자 광고 노출)
    implementation 'com.google.android.gms:play-services-ads:23.1.0'
}
